[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# API (Netlify Function)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# Página dinâmica da conta: /fortnite/{id} e /valorant/{id}
[[redirects]]
  from = "/fortnite/:id"
  to = "/account.html"
  status = 200

[[redirects]]
  from = "/valorant/:id"
  to = "/account.html"
  status = 200
